name: Identity CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "Streetcode.Identity/**"
      - ".github/workflows/identity-ci.yml"
  pull_request:
    paths:
      - "Streetcode.Identity/**"
      - ".github/workflows/identity-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./Streetcode.Identity/Streetcode.Identity.sln

      - name: Build
        run: dotnet build ./Streetcode.Identity/Streetcode.Identity.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./Streetcode.Identity/Streetcode.Identity.sln --configuration Release --no-build --verbosity normal
