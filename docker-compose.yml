services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streetcode-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env}"

    ports:
      - "${MS_SQL_DB_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    container_name: streetcode-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      args:
        Configuration: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: "http://+:5000"
      STREETCODE_ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:?DB_NAME is required, copy .env.example to .env};User Id=${DB_USER:?DB_USER is required, copy .env.example to .env};Password=${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "${API_PORT:-5000}:5000"

    depends_on:
      sqlserver:
        condition: service_healthy

  identity-api:
    container_name: streetcode-identity-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Streetcode.Identity/Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      STREETCODE_IDENTITY_ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${IDENTITY_DB_NAME:-StreetcodeIdentityDb};User Id=${DB_USER:?DB_USER is required, copy .env.example to .env};Password=${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
