services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streetcode-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env}"

    ports:
      - "${MS_SQL_DB_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --tableHost 0.0.0.0 --tablePort 10002"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    restart: unless-stopped

  api:
    container_name: streetcode-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      args:
        Configuration: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: "http://+:5000"
      STREETCODE_ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:?DB_NAME is required, copy .env.example to .env};User Id=${DB_USER:?DB_USER is required, copy .env.example to .env};Password=${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
      STREETCODE_Blob__BlobStoreKey: "${STREETCODE_Blob__BlobStoreKey:?STREETCODE_Blob__BlobStoreKey is required, copy .env.example to .env}"
      STREETCODE_Blob__Provider: "${BLOB_PROVIDER:-Azure}"
      STREETCODE_Blob__Azure__ContainerName: "${BLOB_CONTAINER_NAME:-streetcode-blobs}"
      STREETCODE_Blob__Azure__ConnectionString: "${STREETCODE_Blob__Azure__ConnectionString:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
    ports:
      - "${API_PORT:-5000}:5000"

    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

volumes:
  sqlserver-data:
  azurite-data: