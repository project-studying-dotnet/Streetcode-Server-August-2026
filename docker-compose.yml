services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streetcode-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "${MS_SQL_DB_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    container_name: streetcode-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      args:
        Configuration: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: "http://+:5000"
      STREETCODE_ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME};User Id=${DB_USER};Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"

    ports:
      - "${API_PORT:-5000}:5000"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data: