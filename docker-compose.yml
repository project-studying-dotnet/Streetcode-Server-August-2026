services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env}"

    ports:
      - "${MS_SQL_DB_PORT:-1433}:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        /opt/kafka/bin/kafka-topics.sh \
           --bootstrap-server kafka:19092 \
           --create \
           --if-not-exists \
           --topic email.requested.v1 \
           --partitions 3 \
           --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
           --bootstrap-server kafka:19092 \
           --create \
           --if-not-exists \
           --topic email.requested.v1.dlq \
           --partitions 3 \
           --replication-factor 1
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped

    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  email-api:
    restart: unless-stopped

    build:
      context: ./Streetcode.Email
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__EmailDatabase: "Server=sqlserver,1433;Database=${EMAIL_DB_NAME:?EMAIL_DB_NAME is required};User Id=${DB_USER:?DB_USER is required};Password=${SA_PASSWORD:?SA_PASSWORD is required};TrustServerCertificate=True;MultipleActiveResultSets=True"

      Kafka__BootstrapServers: "kafka:19092"
      Kafka__GroupId: "streetcode-email-service-v1"
      Kafka__Topic: "email.requested.v1"
      Kafka__DeadLetterTopic: "email.requested.v1.dlq"
      Smtp__Host: "${EMAIL_SMTP_HOST:?EMAIL_SMTP_HOST is required}"
      Smtp__Port: "${EMAIL_SMTP_PORT:?EMAIL_SMTP_PORT is required}"
      Smtp__UseSsl: "${EMAIL_SMTP_USE_SSL:?EMAIL_SMTP_USE_SSL is required}"
      Smtp__Username: "${EMAIL_SMTP_USERNAME:?EMAIL_SMTP_USERNAME is required}"
      Smtp__Password: "${EMAIL_SMTP_PASSWORD:?EMAIL_SMTP_PASSWORD is required}"
      Smtp__SenderAddress: "${EMAIL_SMTP_SENDER_ADDRESS:?EMAIL_SMTP_SENDER_ADDRESS is required}"

      EmailTemplates__Feedback__RecipientAddress: "${EMAIL_FEEDBACK_RECIPIENT_ADDRESS:?EMAIL_FEEDBACK_RECIPIENT_ADDRESS is required}"
    ports:
      - "${EMAIL_API_PORT:-8081}:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  api:
    container_name: streetcode-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile
      args:
        Configuration: Release

    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: "http://+:5000"
      STREETCODE_ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:?DB_NAME is required, copy .env.example to .env};User Id=${DB_USER:?DB_USER is required, copy .env.example to .env};Password=${SA_PASSWORD:?SA_PASSWORD is required, copy .env.example to .env};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "${API_PORT:-5000}:5000"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
